<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منظومة مصنع فرنسا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
<style>
/* Layout idea: fixed right sidebar with logo and grouped categories (RTL); bottom tab bar on phones. */
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --surface2:#F7F8FB; --ink:#14213D; --muted:#5C667A; --line:#DDE2EB;
  --navy:#14213D; --accent:#C8412B; --accent-ink:#FFFFFF;
  --good:#1B8A57; --good-bg:#E3F4EB; --bad:#C0262D; --bad-bg:#FBE7E8; --warn:#A8690B; --warn-bg:#FBF0DA;
  --bar1:#14213D; --bar2:#C8412B;
  --font:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif; --display:'Reem Kufi','Cairo',sans-serif;
  --shadow:0 1px 2px rgba(20,33,61,.06),0 4px 14px rgba(20,33,61,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1422; --surface:#161E31; --surface2:#1B2540; --ink:#E8ECF5; --muted:#9AA5BC; --line:#27324D;
    --navy:#0B1020; --accent:#E2634D; --good:#43C98A; --good-bg:#12332A; --bad:#FF7F86; --bad-bg:#3A1A20; --warn:#E8B04F; --warn-bg:#3A2D12;
    --bar1:#7C95D6; --bar2:#E2634D; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1422; --surface:#161E31; --surface2:#1B2540; --ink:#E8ECF5; --muted:#9AA5BC; --line:#27324D;
  --navy:#0B1020; --accent:#E2634D; --good:#43C98A; --good-bg:#12332A; --bad:#FF7F86; --bad-bg:#3A1A20; --warn:#E8B04F; --warn-bg:#3A2D12;
  --bar1:#7C95D6; --bar2:#E2634D; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}

.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{background:var(--navy);color:#E8ECF5;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 6px 16px;border-bottom:1px solid rgba(255,255,255,.14)}
.brand svg{width:54px;height:54px;flex:none}
.brand .t1{font-family:var(--display);font-size:24px;line-height:1.1;font-weight:700;color:#fff}
.brand .t2{font-size:11.5px;color:#AEB9D3;margin-top:3px;letter-spacing:.2px}
.brand .rule{height:3px;width:34px;background:var(--accent);border-radius:2px;margin-top:6px}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup h4{font-size:11.5px;font-weight:600;color:#8E9BBA;padding:0 10px 6px;letter-spacing:.3px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#D6DCEC;text-decoration:none;background:none;border:0;width:100%;text-align:start;cursor:pointer;font-weight:600}
.nav svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav:hover{background:rgba(255,255,255,.07)}
.nav[aria-current="page"]{background:#fff;color:var(--navy)}
.sync{margin-top:auto;font-size:12px;color:#AEB9D3;display:flex;gap:8px;align-items:flex-start;padding:10px;border-radius:10px;background:rgba(255,255,255,.06)}
.dot{width:9px;height:9px;border-radius:50%;background:#8E9BBA;margin-top:6px;flex:none}
.dot.on{background:#4ADE9A}.dot.off{background:#F5B94D}

.main{padding:22px 26px 40px;min-width:0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:24px;font-weight:800;flex:1;min-width:160px}
.top .sub{color:var(--muted);font-size:13px;width:100%;margin-top:-6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 15px;border-radius:10px;cursor:pointer;font-weight:700;min-height:42px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
select,input,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:42px;width:100%}
textarea{min-height:90px;resize:vertical}
.top select{width:auto;min-width:150px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card>h3{font-size:16px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h3 .hint{font-weight:500;color:var(--muted);font-size:12.5px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);border-inline-start:5px solid var(--navy)}
.kpi .l{color:var(--muted);font-size:13px;font-weight:600}
.kpi .v{font-size:25px;font-weight:800;margin-top:2px;line-height:1.25}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.good{border-inline-start-color:var(--good)} .kpi.good .v{color:var(--good)}
.kpi.bad{border-inline-start-color:var(--bad)} .kpi.bad .v{color:var(--bad)}
.kpi.acc{border-inline-start-color:var(--accent)}
.cols2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.cols3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:640px;background:var(--surface)}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--surface2);font-size:12.5px;color:var(--muted);font-weight:700;position:sticky;top:0}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface2)}
td.r,th.r{text-align:end}
tfoot td{font-weight:800;background:var(--surface2)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}
.b-good{background:var(--good-bg);color:var(--good)} .b-bad{background:var(--bad-bg);color:var(--bad)} .b-warn{background:var(--warn-bg);color:var(--warn)} .b-mute{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pos{color:var(--good);font-weight:700}.neg{color:var(--bad);font-weight:700}.mut{color:var(--muted)}

.empty{text-align:center;padding:34px 16px;display:grid;gap:12px;justify-items:center}
.empty h3{font-size:20px}.empty p{color:var(--muted);max-width:460px;margin:0}

.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{height:12px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar .fl{height:100%;border-radius:99px;background:var(--bar1)}
.bar .fl.neg{background:var(--bad)} .bar .fl.pos{background:var(--good)} .bar .fl.acc{background:var(--bar2)}
.chartwrap{overflow-x:auto}
.chartwrap svg{min-width:520px;width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}

.overlay{position:fixed;inset:0;background:rgba(10,16,32,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50;overflow:auto}
.modal{background:var(--surface);border-radius:16px;width:min(760px,100%);max-height:calc(100% - 8px);overflow:auto;padding:20px;border:1px solid var(--line)}
.modal h2{font-size:19px;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.x{border:0;background:var(--surface2);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:20px;line-height:1;flex:none}
.form{display:grid;gap:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
label.f{display:grid;gap:5px;font-size:13px;font-weight:700;color:var(--muted)}
.oprow{display:grid;grid-template-columns:1fr 130px 40px;gap:8px;margin-bottom:8px}
.prev{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px}
.prev .ln{display:flex;justify-content:space-between;gap:10px}
.prev .ln.big{font-weight:800;font-size:16px;border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-start;margin-top:4px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px}
.info{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.step{padding:5px 12px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--muted)}
.step.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;display:grid;gap:10px;justify-items:center;background:var(--surface2)}
.drop.over{border-color:var(--accent)}
.toast{position:fixed;bottom:84px;inset-inline:0;margin-inline:auto;width:max-content;max-width:90%;background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;z-index:80;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.prog{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .15s}

.bottom{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;padding:10px 14px;gap:10px}
  .side .navgroup,.side .sync{display:none}
  .brand{border:0;padding:0}
  .brand svg{width:42px;height:42px}.brand .t1{font-size:20px}
  .main{padding:14px 14px 96px}
  .bottom{display:grid;grid-template-columns:repeat(7,1fr);position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:40;padding:4px 2px calc(4px + env(safe-area-inset-bottom))}
  .bottom button{background:none;border:0;display:grid;gap:2px;justify-items:center;padding:6px 0;font-size:10.5px;font-weight:700;color:var(--muted);cursor:pointer;min-width:0}
  .bottom svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .bottom button[aria-current="page"]{color:var(--accent)}
  .g2,.g3{grid-template-columns:1fr}
  .oprow{grid-template-columns:1fr 100px 40px}
  .top h1{font-size:21px}
  .bar{grid-template-columns:90px 1fr auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
</head>
<body>
<div id="root"></div>
<noscript>الصفحة دي محتاجة JavaScript.</noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
'use strict';
(function () {
  // ---------------------------------------------------------------- helpers
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const nf = new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 });
  const r2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
  const fmt = (n) => nf.format(r2(n));
  const num = (n) => '<span class="num">' + fmt(n) + '</span>';
  const signed = (n) => '<span class="num ' + (n > 0.004 ? 'pos' : n < -0.004 ? 'neg' : 'mut') + '">' + (n > 0.004 ? '+' : '') + fmt(n) + '</span>';
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const pad = (n) => String(n).padStart(2, '0');
  const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  const fdate = (d) => (d ? String(d).split('-').reverse().join('/') : '');
  const MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
  const mlabel = (m) => { const p = String(m).split('-'); return p.length === 2 && MONTHS[+p[1] - 1] ? MONTHS[+p[1] - 1] + ' ' + p[0] : m; };
  const normAr = (s) => String(s == null ? '' : s).toLowerCase().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/[يى]/g, 'ي').replace(/[ً-ْ]/g, '').replace(/[\s_\-\/\.\(\)]+/g, '');
  const arDigits = (s) => String(s).replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));

  // ---------------------------------------------------------------- state
  const S = { clients: [], orders: [], expenses: [], payments: [], fx: [], rates: {} };
  const COLS = ['clients', 'orders', 'expenses', 'payments', 'fx'];
  const F = { month: 'all', q: '' };
  let route = 'dashboard';
  let store = { mode: 'local', db: null, ready: false, error: '', fb: null, online: false };
  const isRemote = () => store.mode === 'cloud' || store.mode === 'firebase';
  const FB_KEY = 'francia-fb-v1';
  const EXP_CATS = ['إيجار', 'كهرباء', 'مياه وغاز', 'مرتبات إدارية وثابتة', 'صيانة ماكينات', 'نقل وشحن', 'مستلزمات تشغيل', 'أخرى'];
  const FX_LABEL = { buy: 'شراء عملة', receive: 'استلام من عميل', sell: 'بيع عملة', pay: 'دفع / تحويل' };
  const FX_IN = ['buy', 'receive'];
  const CURS = ['USD', 'EUR', 'SAR', 'AED', 'GBP'];

  // ---------------------------------------------------------------- calculations
  function computeAll(orders, expenses) {
    const months = {};
    const mk = (m) => months[m] || (months[m] = { pieces: 0, exp: 0, rev: 0, direct: 0, orders: 0, net: 0 });
    const out = orders.map((o) => {
      const done = +o.done || 0, rej = +o.rejected || 0;
      const paid = Math.max(0, done - rej);
      const labor = (o.ops || []).reduce((a, x) => a + (+x.rate || 0), 0);
      const acc = +o.acc || 0, extra = +o.extra || 0;
      const direct = done * (labor + acc) + extra;
      const rev = paid * (+o.price || 0);
      const m = String(o.date || '').slice(0, 7) || '0000-00';
      const b = mk(m);
      b.pieces += done; b.rev += rev; b.direct += direct; b.orders++;
      return Object.assign({}, o, { m, done, rej, paid, labor, acc, extra, direct, rev });
    });
    for (const e of expenses) mk(String(e.date || '').slice(0, 7) || '0000-00').exp += +e.amount || 0;
    for (const o of out) {
      const b = months[o.m];
      const ohpp = b.pieces > 0 ? b.exp / b.pieces : 0;
      o.ohpp = ohpp; o.oh = o.done * ohpp; o.total = o.direct + o.oh; o.profit = o.rev - o.total;
      o.cpp = o.done ? o.total / o.done : 0; o.ppp = o.done ? o.profit / o.done : 0; o.be = o.paid ? o.total / o.paid : 0;
    }
    for (const m in months) months[m].net = months[m].rev - months[m].direct - months[m].exp;
    return { orders: out, months };
  }

  function computeFx(list, rates) {
    const cur = {}; const rows = [];
    const sorted = list.slice().sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')) || (a.ts || 0) - (b.ts || 0));
    for (const t of sorted) {
      const c = String(t.cur || 'USD').toUpperCase();
      const x = cur[c] || (cur[c] = { cur: c, bal: 0, costEgp: 0, realized: 0, inAmt: 0, outAmt: 0 });
      const amt = +t.amount || 0, rate = +t.rate || 0;
      let gain = 0;
      if (FX_IN.indexOf(t.type) >= 0) { x.bal += amt; x.costEgp += amt * rate; x.inAmt += amt; }
      else {
        const avg = x.bal > 0 ? x.costEgp / x.bal : rate;
        gain = (rate - avg) * amt; x.realized += gain; x.costEgp -= avg * amt; x.bal -= amt; x.outAmt += amt;
        if (x.bal <= 1e-9) x.costEgp = 0;
      }
      rows.push(Object.assign({}, t, { cur: c, balAfter: x.bal, gain }));
    }
    const list2 = Object.keys(cur).map((c) => {
      const x = cur[c]; const avg = x.bal > 0 ? x.costEgp / x.bal : 0; const rate = +(rates || {})[c] || 0;
      return Object.assign({}, x, { avg, rate, value: rate ? x.bal * rate : 0, unreal: rate ? x.bal * rate - x.costEgp : 0 });
    });
    return { list: list2, rows: rows.reverse() };
  }

  function clientStats(C) {
    const map = {};
    for (const c of S.clients) map[c.id] = { c, orders: 0, pieces: 0, rev: 0, paid: 0, profit: 0 };
    for (const o of C.orders) { const x = map[o.client]; if (x) { x.orders++; x.pieces += o.done; x.rev += o.rev; x.profit += o.profit; } }
    for (const p of S.payments) { const x = map[p.client]; if (x) x.paid += +p.amount || 0; }
    return Object.keys(map).map((k) => Object.assign(map[k], { bal: map[k].rev - map[k].paid }));
  }

  // ---------------------------------------------------------------- storage (shared db when available, device otherwise)
  const LS_KEY = 'francia-system-v1';
  function loadLocal() {
    try { const j = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); if (j) COLS.forEach((c) => { S[c] = Array.isArray(j[c]) ? j[c] : []; }); if (j && j.rates) S.rates = j.rates; } catch (e) { /* no storage */ }
  }
  function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { /* no storage */ } }
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  async function retry(fn) {
    let last;
    for (let i = 0; i < 5; i++) {
      try { return await fn(); } catch (e) {
        last = e; const code = e && e.code;
        if (code === 'resource_exhausted' || code === 'unavailable') await sleep(400 * (i + 1) + Math.random() * 300); else throw e;
      }
    }
    throw last;
  }
  const clean = (o) => JSON.parse(JSON.stringify(o));
  async function put(col, obj) {
    if (!obj.id) obj.id = uid();
    if (!obj.ts) obj.ts = Date.now();
    if (store.mode === 'cloud') {
      try { await retry(() => store.db.collection(col).doc(obj.id).set(clean(obj))); } catch (e) { handleWriteError(e); throw e; }
    } else if (store.mode === 'firebase') {
      try { await retry(() => fbWrite(col + '/' + obj.id, 'PUT', clean(obj))); } catch (e) { handleWriteError(e); throw e; }
      fbApply('/' + col + '/' + obj.id, clean(obj), false); fbRebuild();
    } else {
      const i = S[col].findIndex((x) => x.id === obj.id);
      if (i >= 0) S[col][i] = obj; else S[col].push(obj);
      saveLocal(); render();
    }
    return obj;
  }
  async function del(col, id) {
    if (store.mode === 'cloud') {
      try { await retry(() => store.db.collection(col).doc(id).delete()); } catch (e) { handleWriteError(e); throw e; }
    } else if (store.mode === 'firebase') {
      try { await retry(() => fbWrite(col + '/' + id, 'DELETE')); } catch (e) { handleWriteError(e); throw e; }
      fbApply('/' + col + '/' + id, null, false); fbRebuild();
    } else { S[col] = S[col].filter((x) => x.id !== id); saveLocal(); render(); }
  }
  async function putRates() {
    if (store.mode === 'cloud') { try { await retry(() => store.db.doc('settings/rates').set({ rates: clean(S.rates) })); } catch (e) { handleWriteError(e); } }

  }
  async function readFile(file) {
    if (typeof XLSX === 'undefined') { toast('مكتبة قراءة Excel لم تتحمّل. تأكد من الإنترنت وحدّث الصفحة.'); return; }
    try {
      const buf = await file.arrayBuffer(); IM.wb = XLSX.read(buf, { type: 'array', cellDates: true }); IM.name = file.name;
      const pick = IM.wb.SheetNames.find((n) => (XLSX.utils.sheet_to_json(IM.wb.Sheets[n], { header: 1 }).length > 1)) || IM.wb.SheetNames[0];
      setSheet(pick); IM.step = 2; renderImport();
    } catch (e) { toast('مقدرتش أقرأ الملف ده. تأكد إنه Excel سليم.'); }
  }
  function setSheet(name) {
    IM.sheet = name; IM.rows = XLSX.utils.sheet_to_json(IM.wb.Sheets[name], { header: 1, raw: true, defval: '' });
    IM.hdr = detectHeader(IM.rows); const n = normAr(name);
    if (/مصروف|مصاريف|expense/.test(n)) IM.type = 'expenses'; else if (/دفع|تحصيل|payment|ايداع/.test(n)) IM.type = 'payments'; else if (/عمل|دولار|usd|fx|صرف/.test(n)) IM.type = 'fx'; else if (/اوردر|انتاج|order|تصنيع/.test(n)) IM.type = 'orders';
    guessMap();
  }
  function detectHeader(rows) {
    for (let i = 0; i < Math.min(rows.length, 15); i++) { const r = rows[i] || []; const filled = r.filter((c) => String(c == null ? '' : c).trim() !== ''); const strs = filled.filter((c) => typeof c === 'string'); if (filled.length >= 2 && strs.length >= filled.length * 0.7) return i; }
    return 0;
  }
  function guessMap() {
    const hdrs = (IM.rows[IM.hdr] || []).map((x) => normAr(x)); const used = {}; IM.map = {};
    IMPORT_TYPES[IM.type].fields.forEach((f) => {
      const syn = (SYN[f[0]] || []).map(normAr); let found = -1;
      for (const s of syn) { const idx = hdrs.findIndex((h, i) => !used[i] && h && h.indexOf(s) >= 0); if (idx >= 0) { found = idx; break; } }
      if (found >= 0) { used[found] = 1; IM.map[f[0]] = String(found); }
    });
  }
  function toNum(v) { if (typeof v === 'number') return isFinite(v) ? v : 0; if (v == null) return 0; const s = arDigits(String(v)).replace(/[,٬\s]/g, '').replace(/٫/g, '.').replace(/[^\d.\-]/g, ''); const n = parseFloat(s); return isFinite(n) ? n : 0; }
  function todayFromDate(d) { const x = new Date(d.getTime() + 12 * 3600 * 1000); return x.getUTCFullYear() + '-' + pad(x.getUTCMonth() + 1) + '-' + pad(x.getUTCDate()); }
  function toDate(v) {
    if (v instanceof Date && !isNaN(v)) return todayFromDate(v);
    if (typeof v === 'number' && v > 20000 && v < 80000) return todayFromDate(new Date(Math.round((v - 25569) * 86400 * 1000)));
    const s = arDigits(String(v == null ? '' : v)).trim(); let m;
    if ((m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return m[1] + '-' + pad(+m[2]) + '-' + pad(+m[3]);
    if ((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))) { let y = +m[3]; if (y < 100) y += 2000; return y + '-' + pad(+m[2]) + '-' + pad(+m[1]); }
    return todayISO();
  }
  function toFxType(v) { const s = normAr(v); if (/بيع|sell|sale/.test(s)) return 'sell'; if (/استلام|تحصيل|receive|وارد|ايداع/.test(s)) return 'receive'; if (/دفع|سداد|pay|صادر|تحويل|سحب/.test(s)) return 'pay'; return 'buy'; }
  function toCur(v) { const s = normAr(v); if (!s) return 'USD'; if (/دولار|usd|\$/.test(s)) return 'USD'; if (/يورو|eur/.test(s)) return 'EUR'; if (/ريال|sar/.test(s)) return 'SAR'; if (/درهم|aed/.test(s)) return 'AED'; if (/استرليني|gbp|جنيهاسترليني/.test(s)) return 'GBP'; return String(v).trim().toUpperCase().slice(0, 4); }

  async function runImport() {
    const t = IMPORT_TYPES[IM.type]; const msg = $('#impMsg'); msg.style.display = 'none';
    const miss = t.req.filter((k) => !IM.map[k]);
    if (miss.length) { msg.textContent = 'لازم تحدد عمود: ' + miss.map((k) => t.fields.find((f) => f[0] === k)[1]).join('، '); msg.style.display = 'block'; return; }
    const data = IM.rows.slice(IM.hdr + 1).filter((r) => r.some((c) => String(c == null ? '' : c).trim() !== ''));
    const val = (r, k) => (IM.map[k] === undefined || IM.map[k] === '' ? undefined : r[+IM.map[k]]);
    const btn = $('#doImport'); btn.disabled = true; $('#progbar').style.display = 'block';
    const recs = []; let skipped = 0; const newClients = {}; const cmap = {};
    S.clients.forEach((c) => { cmap[normAr(c.name)] = c.id; });
    const clientId = (name) => { name = String(name == null ? '' : name).trim(); if (!name) return ''; const k = normAr(name); if (!cmap[k]) { const c = { id: uid(), name, ts: Date.now() }; cmap[k] = c.id; newClients[c.id] = c; } return cmap[k]; };
    data.forEach((r) => {
      if (IM.type === 'orders') {
        const price = toNum(val(r, 'price')); const qty = toNum(val(r, 'qty')); let done = toNum(val(r, 'done')); if (!price && !qty && !done) { skipped++; return; }
        if (IM.map.done === undefined && qty) done = qty; const labor = toNum(val(r, 'labor'));
        recs.push(['orders', { id: uid(), date: toDate(val(r, 'date')), client: clientId(val(r, 'client')), model: String(val(r, 'model') == null ? '' : val(r, 'model')).trim(), qty, done, rejected: toNum(val(r, 'rejected')), price, ops: labor ? [{ name: 'تشغيل', rate: labor }] : [], acc: toNum(val(r, 'acc')), extra: toNum(val(r, 'extra')), notes: 'مستورد من ' + IM.name }]);
      } else if (IM.type === 'expenses') {
        const a = toNum(val(r, 'amount')); if (!a) { skipped++; return; }
        recs.push(['expenses', { id: uid(), date: toDate(val(r, 'date')), cat: String(val(r, 'cat') || 'أخرى').trim() || 'أخرى', desc: String(val(r, 'desc') == null ? '' : val(r, 'desc')).trim(), amount: a }]);
      } else if (IM.type === 'payments') {
        const a = toNum(val(r, 'amount')); if (!a) { skipped++; return; }
        recs.push(['payments', { id: uid(), date: toDate(val(r, 'date')), client: clientId(val(r, 'client')), amount: a, note: String(val(r, 'note') == null ? '' : val(r, 'note')).trim() }]);
      } else {
        const a = toNum(val(r, 'amount')); if (!a) { skipped++; return; }
        recs.push(['fx', { id: uid(), date: toDate(val(r, 'date')), type: toFxType(val(r, 'type')), cur: toCur(val(r, 'cur')), amount: Math.abs(a), rate: toNum(val(r, 'rate')), note: String(val(r, 'note') == null ? '' : val(r, 'note')).trim() }]);
      }
    });
    const ncl = Object.keys(newClients).map((k) => newClients[k]); const total = ncl.length + recs.length; let n = 0;
    IM.busy = true;
    try {
      for (const c of ncl) { await put('clients', c); progress(++n, total); }
      for (const r of recs) { await put(r[0], r[1]); progress(++n, total); }
      IM.result = { count: recs.length, clients: ncl.length, skipped }; IM.step = 3; IM.busy = false; render();
    } catch (e) { IM.busy = false; btn.disabled = false; msg.textContent = 'الاستيراد وقف بعد ' + n + ' سجل. اللي اتضاف اتحفظ، وتقدر تكمل بعد ما تراجع الصلاحيات.'; msg.style.display = 'block'; }
  }

  // ---------------------------------------------------------------- settings, backup, sample data
  function vConfig() {
    const n = COLS.reduce((a, c) => a + S[c].length, 0); const demo = COLS.reduce((a, c) => a + S[c].filter((x) => x.demo).length, 0);
    let localHas = false; try { const j = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); localHas = !!(j && COLS.some((c) => (j[c] || []).length)); } catch (e) { localHas = false; }
    return head() + '<div class="grid cols2"><div class="card"><h3>حالة المزامنة</h3><p style="margin-top:0">' + (store.mode === 'cloud' ? '<span class="badge b-good">متزامن</span> البيانات متخزنة في حساب الصفحة وبتظهر لأي حد عنده صلاحية. لإضافة والدك: شارك الصفحة معاه بصلاحية "Contributor" (يقدر يعدّل) من زر المشاركة.' : store.mode === 'firebase' ? '<span class="badge ' + (store.online ? 'b-good' : 'b-warn') + '">Firebase</span> البيانات بتتزامن تلقائي بين كل الأجهزة المتصلة بنفس القاعدة وكلمة السر.' : '<span class="badge b-warn">على الجهاز فقط</span> الصفحة مش مشاركة دلوقتي، فالبيانات بتتحفظ في متصفح الجهاز ده بس. لما تشارك الصفحة وتفتحها تاني هتتزامن.') + '</p><p class="mut" style="margin-bottom:0">عدد السجلات: <b class="num">' + n + '</b>' + (store.error ? ' • خطأ اتصال: ' + esc(store.error) : '') + '</p>' + (isRemote() && localHas ? '<div class="row" style="margin-top:10px"><button class="btn" data-act="pushLocal">رفع بيانات الجهاز للمزامنة</button></div><div class="prog" style="margin-top:8px"><i id="progfill"></i></div><div class="mut" id="progtext" style="font-size:12px"></div>' : '') + '</div>' +
      '<div class="card"><h3>بيانات تجريبية</h3><p style="margin-top:0" class="mut">جرّب المنظومة ببيانات وهمية، وبعدين امسحها بضغطة من غير ما تأثر على بياناتك الحقيقية.</p><div class="row"><button class="btn" data-act="sample">تحميل بيانات تجريبية</button><button class="btn danger" data-act="delDemo"' + (demo ? '' : ' disabled') + '>مسح التجريبية (' + demo + ')</button></div></div></div>' +
      fbCard() + '<div class="card" style="margin-top:14px"><h3>نسخة احتياطية</h3><div class="row"><button class="btn" data-act="backup">نسخ البيانات (JSON)</button><button class="btn" data-act="restoreForm">استرجاع من نسخة</button></div><p class="mut" style="margin-bottom:0;font-size:12.5px">خد نسخة احتياطية من وقت لوقت وخزّنها في مكان آمن.</p></div>' +
      '<div class="card" style="margin-top:14px"><h3>منطقة الخطر</h3><button class="btn danger" data-act="wipe">مسح كل البيانات</button></div>';
  }
  async function loadSample() {
    const base = new Date(); const ym = (k) => { const d = new Date(base.getFullYear(), base.getMonth() - k, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
    const cl = [['شركة النيل للملابس', '0100000001'], ['مؤسسة الأمل', '0100000002'], ['براند ستايل', '0100000003']].map((x) => ({ id: uid(), name: x[0], phone: x[1], demo: true }));
    const ops = (a, b, c, d) => [{ name: 'قص', rate: a }, { name: 'خياطة', rate: b }, { name: 'كي', rate: c }, { name: 'تغليف', rate: d }];
    const orders = []; [[2, 0, 'تيشرت بولو', 1500, 1500, 38, ops(3, 14, 2, 1), 1.5], [2, 1, 'بنطلون جينز', 800, 790, 70, ops(4, 28, 3, 1.5), 3], [1, 0, 'قميص رجالي', 1000, 1000, 52, ops(3.5, 20, 2.5, 1.5), 2], [1, 2, 'جاكيت', 400, 400, 85, ops(6, 42, 4, 2), 6], [0, 1, 'تيشرت أطفال', 2000, 1200, 24, ops(2, 10, 1.5, 1), 1]].forEach((x, i) => { orders.push({ id: uid(), date: ym(x[0]) + '-' + pad(8 + i * 3), client: cl[x[1]].id, model: x[2], qty: x[3], done: x[4], rejected: i === 1 ? 20 : 0, price: x[5], ops: x[6], acc: x[7], extra: 0, demo: true }); });
    const exps = []; [2, 1, 0].forEach((k) => { [['إيجار', 30000], ['كهرباء', 9000 + k * 700], ['مياه وغاز', 2500], ['مرتبات إدارية وثابتة', 28000], ['صيانة ماكينات', 4000]].forEach((e) => exps.push({ id: uid(), date: ym(k) + '-01', cat: e[0], desc: '', amount: e[1], demo: true })); });
    const pays = [{ id: uid(), date: ym(1) + '-20', client: cl[0].id, amount: 40000, note: 'دفعة أولى', demo: true }, { id: uid(), date: ym(0) + '-05', client: cl[2].id, amount: 20000, note: '', demo: true }];
    const fx = [{ id: uid(), date: ym(2) + '-05', type: 'buy', cur: 'USD', amount: 2000, rate: 48.5, note: 'شراء', demo: true }, { id: uid(), date: ym(1) + '-12', type: 'receive', cur: 'USD', amount: 1000, rate: 49.2, note: 'من عميل', demo: true }, { id: uid(), date: ym(0) + '-03', type: 'sell', cur: 'USD', amount: 1500, rate: 50.4, note: 'بيع', demo: true }];
    const all = [].concat(cl.map((x) => ['clients', x]), orders.map((x) => ['orders', x]), exps.map((x) => ['expenses', x]), pays.map((x) => ['payments', x]), fx.map((x) => ['fx', x]));
    for (const a of all) await put(a[0], a[1]);
    toast('اتحملت بيانات تجريبية');
  }
  async function delDemo() { for (const c of COLS) for (const x of S[c].filter((y) => y.demo)) await del(c, x.id); toast('اتمسحت البيانات التجريبية'); }
  async function wipe() { for (const c of COLS) for (const x of S[c].slice()) await del(c, x.id); S.rates = {}; await putRates(); toast('اتمسحت كل البيانات'); }

  // ---------------------------------------------------------------- events
  document.addEventListener('click', async (e) => {
    const t = e.target.closest('[data-act]'); if (!t) return; const a = t.dataset.act, id = t.dataset.id;
    try {
      switch (a) {
        case 'nav': route = t.dataset.r; location.hash = route; window.scrollTo(0, 0); render(); break;
        case 'closeModal': closeModal(); break;
        case 'newOrder': orderForm(); break;
        case 'editOrder': closeModal(); orderForm(S.orders.find((x) => x.id === id)); break;
        case 'viewOrder': viewOrder(id); break;
        case 'delOrder': confirmBox('تمسح الأوردر ده؟', async () => { await del('orders', id); toast('اتمسح'); }); break;
        case 'addOp': $('#opsRows').insertAdjacentHTML('beforeend', opRow('', '')); break;
        case 'rmOp': t.closest('.oprow').remove(); updatePreview($('form[data-form=order]')); break;
        case 'copyOrders': copyOrders(); break;
        case 'newClient': clientForm(); break;
        case 'newPayment': paymentForm(id); break;
        case 'stmt': statement(id); break;
        case 'delPay': confirmBox('تمسح الدفعة دي؟', async () => { await del('payments', id); }); break;
        case 'newExpense': expenseForm(); break;
        case 'editExpense': expenseForm(S.expenses.find((x) => x.id === id)); break;
        case 'delExpense': confirmBox('تمسح المصروف ده؟', async () => { await del('expenses', id); }); break;
        case 'newFx': fxForm(); break;
        case 'delFx': confirmBox('تمسح الحركة دي؟', async () => { await del('fx', id); }); break;
        case 'impAgain': IM.step = 1; IM.wb = null; renderImport(); break;
        case 'sample': await loadSample(); break;
        case 'delDemo': confirmBox('تمسح كل البيانات التجريبية؟', delDemo); break;
        case 'wipe': confirmBox('ده هيمسح كل البيانات نهائياً. متأكد؟', wipe); break;
        case 'pushLocal': await pushLocalToCloud(); break;
        case 'fbDisconnect': confirmBox('تفصل المزامنة من الجهاز ده؟ البيانات هتفضل على Firebase.', async () => { disconnectFirebase(); }); break;
        case 'copyLink': if (location.protocol === 'file:') { toast('الصفحة لازم تتحمّل من لينك على الإنترنت الأول (استضافة). شوف الخطوات اللي بعتهالك.'); } else copyText(shareLink(), 'اتنسخ الرابط. ابعته لباباك على واتساب.'); break;
        case 'copyRules': copyText(FB_RULES, 'اتنسخت القواعد'); break;
        case 'backup': copyText(JSON.stringify({ clients: S.clients, orders: S.orders, expenses: S.expenses, payments: S.payments, fx: S.fx, rates: S.rates }), 'اتنسخت النسخة الاحتياطية. الصقها في ملف نصي واحفظها.'); break;
        case 'restoreForm': openModal('استرجاع نسخة احتياطية', '<form class="form" data-form="restore"><label class="f">الصق نص النسخة هنا<textarea name="json" required></textarea></label><div class="note">الاسترجاع بيضيف السجلات على الموجودة (مش بيمسح حاجة).</div><div class="actions"><button class="btn primary" type="submit">استرجاع</button><button class="btn" type="button" data-act="closeModal">إلغاء</button></div></form>'); break;
        default: break;
      }
    } catch (err) { /* write errors already toasted */ }
  });
  document.addEventListener('submit', async (e) => {
    const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); const k = f.dataset.form; const g = (n) => (f.elements[n] ? f.elements[n].value : '');
    const btn = $('button[type=submit]', f); if (btn) btn.disabled = true;
    try {
      if (k === 'order') await saveOrder(f);
      else if (k === 'client') { await put('clients', { id: uid(), name: g('name').trim(), phone: g('phone').trim() }); closeModal(); }
      else if (k === 'payment') { const cid = await findOrCreateClient(g('client')); await put('payments', { id: uid(), date: g('date'), client: cid, amount: parseFloat(g('amount')) || 0, note: g('note').trim() }); closeModal(); toast('اتسجلت الدفعة'); }
      else if (k === 'expense') { const old = S.expenses.find((x) => x.id === g('id')); await put('expenses', Object.assign({}, old || {}, { id: g('id') || uid(), date: g('date'), cat: g('cat'), desc: g('desc').trim(), amount: parseFloat(g('amount')) || 0 })); closeModal(); toast('اتحفظ'); }
      else if (k === 'fx') { await put('fx', { id: uid(), date: g('date'), type: g('type'), cur: g('cur').trim().toUpperCase(), amount: parseFloat(g('amount')) || 0, rate: parseFloat(g('rate')) || 0, note: g('note').trim() }); closeModal(); toast('اتسجلت الحركة'); }
      else if (k === 'fb') { await connectFirebase(g('url'), g('key')); if (btn) btn.disabled = false; }
      else if (k === 'restore') {
        const j = JSON.parse(g('json')); let n = 0;
        for (const c of COLS) for (const o of (j[c] || [])) { await put(c, o); n++; }
        if (j.rates) { S.rates = Object.assign({}, S.rates, j.rates); await putRates(); }
        closeModal(); toast('اترجّع ' + n + ' سجل');
      }
    } catch (err) { if (btn) btn.disabled = false; if (k === 'restore') toast('النص مش نسخة صحيحة.'); }
  });
  document.addEventListener('input', (e) => {
    const f = e.target.closest('form[data-form=order]'); if (f) updatePreview(f);
    if (e.target.id === 'qBox') { F.q = e.target.value; document.body.dataset.refocus = '1'; schedule(); }
  });
  document.addEventListener('change', async (e) => {
    if (e.target.id === 'monthSel') { F.month = e.target.value; render(); }
    const r = e.target.dataset && e.target.dataset.rate; if (r) { const v = parseFloat(e.target.value); if (v > 0) S.rates[r] = v; else delete S.rates[r]; await putRates(); if (isRemote()) schedule(); }
  });
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
  window.addEventListener('hashchange', () => { const h = location.hash.replace('#', ''); if (TITLES[h] && h !== route) { route = h; render(); } });

  // test hook for pure functions (no effect in the page)
  window.__francia = { S, store, put, del, startFirebase, fbApply, encCfg, readCfgFromHash, computeAll, computeFx, toNum, toDate, toFxType, toCur, normAr, detectHeader };

  // ---------------------------------------------------------------- start
  { const h = location.hash.replace('#', ''); if (TITLES[h]) route = h; }
  initStore();
})();
